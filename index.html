<style>
:root {
  --velvet: #5a1420;
  --velvet-deep: #3a0a14;
  --velvet-glow: #7a1c2c;
  --burgundy: #4a0e1c;
  --gold: #d4a341;
  --gold-bright: #f0c869;
  --gold-deep: #a8782a;
  --cream: #f4ead0;
  --parchment: #ede0bc;
  --ink: #1a0a0d;
  --ink-soft: #3a1f24;
  --shadow-deep: rgba(0,0,0,0.6);
  --bulb-glow: 0 0 12px rgba(240,200,105,0.7), 0 0 24px rgba(240,200,105,0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  background: var(--velvet-deep);
  color: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ─────────── Theater background texture ─────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at top, rgba(212, 163, 65, 0.12) 0%, transparent 50%),
    radial-gradient(ellipse at bottom, rgba(122, 28, 44, 0.4) 0%, transparent 60%),
    repeating-linear-gradient(
      90deg,
      var(--velvet-deep) 0px,
      var(--velvet-deep) 1px,
      var(--velvet) 1px,
      var(--velvet) 2px,
      var(--velvet-deep) 2px,
      var(--velvet-deep) 4px
    );
  z-index: -2;
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.08'/></svg>");
  z-index: -1;
  pointer-events: none;
  mix-blend-mode: overlay;
}

/* ─────────── Curtain reveal animation ─────────── */
.curtain {
  position: fixed;
  top: 0;
  bottom: 0;
  width: 52%;
  background:
    repeating-linear-gradient(
      90deg,
      var(--velvet-deep) 0px,
      var(--velvet) 12px,
      var(--velvet-glow) 24px,
      var(--velvet) 36px,
      var(--velvet-deep) 48px
    );
  box-shadow: inset 0 0 80px rgba(0,0,0,0.7);
  z-index: 1000;
  animation: curtainOpen 1.8s cubic-bezier(0.7, 0, 0.3, 1) 0.3s forwards;
}

.curtain.left { left: 0; transform-origin: left center; }
.curtain.right { right: 0; transform-origin: right center; }

.curtain.left { animation-name: curtainOpenLeft; }
.curtain.right { animation-name: curtainOpenRight; }

@keyframes curtainOpenLeft {
  0% { transform: translateX(0); }
  100% { transform: translateX(-105%); }
}

@keyframes curtainOpenRight {
  0% { transform: translateX(0); }
  100% { transform: translateX(105%); }
}

.curtain-rope {
  position: fixed;
  top: 0;
  width: 100%;
  height: 28px;
  background: linear-gradient(180deg, var(--gold-deep) 0%, var(--gold) 50%, var(--gold-deep) 100%);
  z-index: 50;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 -2px 0 rgba(0,0,0,0.3);
}

.curtain-rope::before {
  content: '';
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  height: 16px;
  background:
    radial-gradient(ellipse 12px 14px at 12px 0, var(--gold-deep) 0%, var(--gold-deep) 90%, transparent 90%),
    radial-gradient(ellipse 12px 14px at 36px 0, var(--gold-deep) 0%, var(--gold-deep) 90%, transparent 90%);
  background-size: 24px 14px;
  background-repeat: repeat-x;
}

/* ─────────── Marquee header ─────────── */
.marquee {
  position: relative;
  text-align: center;
  padding: 70px 24px 56px;
  margin-top: 36px;
  background:
    radial-gradient(ellipse at center, rgba(212,163,65,0.15) 0%, transparent 70%),
    linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.2) 100%);
}

/* Bulb light strips */
.bulb-row {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 0 20px;
}

.bulb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--gold-bright), var(--gold) 60%, var(--gold-deep));
  box-shadow: var(--bulb-glow);
  animation: bulbFlicker 3s ease-in-out infinite;
  flex-shrink: 0;
}

.bulb:nth-child(odd) { animation-delay: 0.5s; }
.bulb:nth-child(3n) { animation-delay: 1s; }
.bulb:nth-child(4n) { animation-delay: 1.5s; }

@keyframes bulbFlicker {
  0%, 100% { opacity: 1; box-shadow: var(--bulb-glow); }
  45% { opacity: 0.85; }
  50% { opacity: 0.6; box-shadow: 0 0 6px rgba(240,200,105,0.4); }
  55% { opacity: 0.9; }
}

@media (prefers-reduced-motion: reduce) {
  .curtain { display: none; }
  .bulb { animation: none; }
}

.marquee-frame {
  max-width: 880px;
  margin: 32px auto;
  padding: 36px 28px 32px;
  border: 2px solid var(--gold);
  position: relative;
  background: rgba(26, 10, 13, 0.4);
  backdrop-filter: blur(2px);
}

.marquee-frame::before,
.marquee-frame::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border: 2px solid var(--gold-bright);
}

.marquee-frame::before {
  top: -2px;
  left: -2px;
  border-right: none;
  border-bottom: none;
}

.marquee-frame::after {
  bottom: -2px;
  right: -2px;
  border-left: none;
  border-top: none;
}

.kicker {

  font-style: italic;

}

h1.cinema-name {

.cinema-subtitle {

}

.ornament {

}

.ornament-line {

.season {

/* ─────────── Now Showing badge ─────────── */
.now-showing-section {

.now-showing {

/* ─────────── Gallery ─────────── */
.gallery-section {
  max-width: 1200px;

}

.gallery-header {
  text-align: center;

}

.gallery-title {

/* ─────────── Poster card ─────────── */
.poster {
  background: linear-gradient(180deg, #2a0a10 0%, var(--velvet-deep) 100%);
  border: 1px solid var(--gold-deep);
  position: relative;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
  display: flex;
  flex-direction: column;
}

.poster:hover,
.poster:focus-visible {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--gold);
  outline: none;
}

.poster-frame {
  padding: 12px 12px 0;
}

.poster-thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  background: var(--ink);
  overflow: hidden;
  border: 1px solid rgba(212,163,65,0.3);
}

.poster-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s, filter 0.3s;
  filter: saturate(0.9) contrast(1.05);
}

.poster:hover .poster-thumb img {
  transform: scale(1.06);
  filter: saturate(1.1) contrast(1.1);
}

.poster-thumb::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5) 100%),
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.06) 3px,
      rgba(0,0,0,0.06) 4px
    );

}

.play-button {
  position: absolute;

  transform: translate(-50%, -50%);

}

.poster:hover .play-button {
  transform: translate(-50%, -50%) scale(1.1);

}

.play-button::before {
  content: '';
  width: 0;
  height: 0;
  border-left: 18px solid var(--ink);

  border-bottom: 12px solid transparent;

}


.poster-info {

.footer {

/* ─────────── Modal ─────────── */

<!-- Marquee header -->

      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line"></div>
    </div>
    <div class="season" id="season">2026 暑期創作影展</div>
  </div>

  <div class="bulb-row" aria-hidden="true" id="bulbRowBottom"></div>
</header>

<!-- Now showing -->
<section class="now-showing-section">
  <div class="now-showing">★ 現 正 上 映 ★</div>
  <p class="welcome-text" id="welcomeText"></p>
</section>

<!-- Gallery -->
<section class="gallery-section">
  <div class="gallery-header">
    <h2 class="gallery-title">本期作品</h2>
    <div class="gallery-title-en">Featured Programmes</div>
  </div>
  <div class="gallery" id="gallery"></div>
</section>

<!-- Footer -->
<footer class="footer">
  <div class="footer-mark">★ FIN ★</div>
  <p class="footer-text">
    感謝所有家長今天的蒞臨。<br>
    每一部影片都是孩子們從畫角色、配音、剪輯一手完成，<br>
    請替他們鼓鼓掌。
  </p>
  <div class="footer-end">— Thank you for joining us —</div>
</footer>

<!-- Modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-stage">
    <button class="modal-close" id="modalClose" aria-label="關閉">×</button>
    <div class="modal-frame">
      <div class="modal-video" id="modalVideo"></div>
      <div class="modal-info">
        <div class="modal-tag">Now Playing</div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-students" id="modalStudents"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ─────────── YouTube ID extraction ───────────
function extractYouTubeId(url) {
  if (!url) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

// ─────────── Roman numerals ───────────
function toRoman(n) {
  const map = [
    ['M', 1000], ['CM', 900], ['D', 500], ['CD', 400],
    ['C', 100], ['XC', 90], ['L', 50], ['XL', 40],
    ['X', 10], ['IX', 9], ['V', 5], ['IV', 4], ['I', 1]
  ];
  let result = '';
  for (const [letter, value] of map) {
    while (n >= value) { result += letter; n -= value; }
  }
  return result;
}

// ─────────── Setup ───────────
function setupHeader() {
  document.getElementById('cinemaName').textContent = GALLERY.cinemaName || 'AI動畫師';
  document.getElementById('kicker').textContent = GALLERY.subtitle || "Children's Story Film Festival";
  document.getElementById('season').textContent = GALLERY.season || '';
  document.getElementById('welcomeText').textContent = GALLERY.welcome || '';
  document.title = (GALLERY.cinemaName || 'AI動畫師') + ' · ' + (GALLERY.season || '影展');

  // Bulbs - count adapts to viewport
  const makeBulbs = (id) => {
    const row = document.getElementById(id);
    const count = window.innerWidth < 600 ? 11 : window.innerWidth < 900 ? 17 : 23;
    row.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'bulb';
      row.appendChild(b);
    }
  };
  makeBulbs('bulbRowTop');
  makeBulbs('bulbRowBottom');
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  if (!GALLERY.works || GALLERY.works.length === 0) {
    gallery.innerHTML = `
      <div class="empty" style="grid-column: 1 / -1">
        <strong>布幕拉開了，但還沒有作品上架</strong>
        請老師打開 HTML 檔，編輯最上方的 <code>works</code> 清單來新增作品。
      </div>`;
    return;
  }

  gallery.innerHTML = GALLERY.works.map((work, i) => {
    const id = extractYouTubeId(work.youtubeUrl);
    const thumb = id
      ? `https://img.youtube.com/vi/${id}/hqdefault.jpg`
      : null;
    const title = escapeHtml(work.title || `第 ${i+1} 號作品`);
    const students = escapeHtml(work.students || '');

    return `
      <article class="poster" tabindex="0" role="button"
               aria-label="觀賞 ${title}"
               data-index="${i}">
        <div class="poster-frame">
          <div class="poster-thumb"></div>
            ${thumb
              ? `<img src="${thumb}" alt="" loading="lazy"
                     onerror="this.style.background='var(--velvet)';this.style.opacity='0.4'">`
              : `<div style="width:100%;height:100%;display:grid;place-items:center;color:var(--gold-deep);font-family:'Bodoni Moda',serif;font-style:italic">No video linked</div>`
            }
            ${id ? `<div class="play-button" aria-hidden="true"></div>` : ''}
          </div>
        </div>
        <div class="poster-info">
          <div class="poster-tag">A Short Film</div>
          <h3 class="poster-title">${title}</h3>
          <div class="poster-divider"></div>
          ${students ? `
            <div class="poster-students">
              <span class="poster-students-label">Featuring</span>
              ${students}
            </div>
          ` : ''}
        </div>
      </article>
    `;
  }).join('');

  // Wire up clicks
  gallery.querySelectorAll('.poster').forEach(el => {
    const open = () => openModal(parseInt(el.dataset.index));
    el.addEventListener('click', open);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );
}

// ─────────── Modal ───────────
const modal = document.getElementById('modal');
const modalVideo = document.getElementById('modalVideo');
const modalTitle = document.getElementById('modalTitle');
const modalStudents = document.getElementById('modalStudents');

function openModal(index) {
  const work = GALLERY.works[index];
  if (!work) return;
  const id = extractYouTubeId(work.youtubeUrl);
  if (!id) {
    alert('這個影片的網址有問題，請老師檢查 youtubeUrl');
    return;
  }

  modalTitle.textContent = work.title || `第 ${index+1} 號作品`;
  modalStudents.textContent = work.students || '';
  modalVideo.innerHTML = `<iframe
    src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1"
    title="${escapeHtml(work.title || '影片')}"
    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen></iframe>`;

  modal.classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('visible');
  modalVideo.innerHTML = ''; // stop the video
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modal.classList.contains('visible')) closeModal();
});

// ─────────── Init ───────────
setupHeader();
renderGallery();

// Re-bulb on resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(setupHeader, 200);
});
</script>

</body>
</html>
